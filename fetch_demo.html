<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo fetch</title>
    <style>
        table{
            width:80vw;
            border-collapse:collapse;
            margin:auto;

        }
        th,td{
            border:2px solid red;
            text-align:center;
        }
    </style>
    <script>
        const url="https://dummyjson.com/products?limit=10&skip=6";
        async function loadproducts(){
            try{
                const response = await fetch(url);
                console.log("res=",response);
                const data = await response.json();
                console.log("data=",data.products);
                let rows="";
                data.products.map((i,index)=>(
                    rows+=`<tr>
                        <td>${index+1}</td>
                        <td>${i.title}</td>
                        <td><img src = ${i.images[0]} width=50 height=50/></td>
                        <td>${i.category}</td>
                        <td>${i.rating}</td>
                        <td>${i.price}</td>
                        <td><button>addtocart</button></td>
                        
                    </tr>`
                ))
                const el=document.getElementById("data");
                el.innerHTML=rows;
            }
            catch(err){
                console.log("err=",err);
            }
        }
        loadproducts();
    </script>
</head>
<body>
    <h1><center>List of Products</center></h1>
    <table border>
        <thead>
            <tr>
                <th>SR.no</th>
                <th>Title</th>
                <th>Category</th>
                <th>Rating</th>
                <th>price($)</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>

        </thead>
        <tbody id="data">
        
        </tbody>
    </table>
</body>
</html>
